name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches manifest.json and versions.json
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
            if (manifest.version !== tag) {
              console.error('Tag ' + tag + ' does not match manifest.json version ' + manifest.version + '.');
              console.error('Run scripts/bump-version.mjs ' + tag + ' before tagging, or retag the correct commit.');
              process.exit(1);
            }
            if (!Object.prototype.hasOwnProperty.call(versions, tag)) {
              console.error('Tag ' + tag + ' has no matching key in versions.json.');
              process.exit(1);
            }
            console.log('OK: tag ' + tag + ' matches manifest.json (' + manifest.version + ') and versions.json.');
          "

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: E2E gate
        run: timeout 600 npm run e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .e2e/artifact.json
            .e2e/results/

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
            const start = lines.findIndex((l) => l.startsWith('## [' + tag + ']'));
            if (start === -1) {
              console.error('CHANGELOG.md has no \"## [' + tag + ']\" section.');
              console.error('Add one before tagging a release (see CHANGELOG.md header for the convention).');
              process.exit(1);
            }
            let end = lines.findIndex((l, i) => i > start && l.startsWith('## '));
            if (end === -1) end = lines.length;
            const section = lines.slice(start, end).join('\n').trim() + '\n';
            fs.writeFileSync('release-notes.md', section);
          "

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber main.js main.js.map manifest.json styles.css
          else
            gh release create "$tag" \
              --title "$tag" \
              --notes-file release-notes.md \
              main.js main.js.map manifest.json styles.css
          fi
