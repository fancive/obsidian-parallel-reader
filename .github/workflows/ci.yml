name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint (Obsidian review rules)
        run: npm run lint:obsidian

      - name: Lint (Obsidian strict review)
        run: npm run lint:obsidian:review:all

      - name: Coverage (thresholds)
        run: npm run coverage

      # Percentage thresholds cannot catch a harness that stops measuring: the old
      # bundled harness reported 100% of only 32 branches. This asserts the absolute
      # branch/function totals so that regression fails the build.
      - name: Coverage (shape assertion)
        run: npm run coverage:assert

      - name: E2E gate
        run: timeout 600 npm run e2e

      - name: Upload e2e artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            .e2e/artifact.json
            .e2e/results/
